[project]
name = "aicte-nexus"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "python migrate.py"
